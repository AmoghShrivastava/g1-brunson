name: G1 runner container

on:
  push:
    branches: [container]
    paths: ["container/**", ".github/workflows/container.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the HIM builder kit
        run: |
          curl -sL https://arena.himrobotics.com/policy-contracts/g1-builder-kit-e93c492-v1.zip -o kit.zip
          unzip -q kit.zip -d kitsrc
          mkdir -p kitsrc/g1-builder-kit/brunson
          cp -r container/. kitsrc/g1-builder-kit/brunson/

      - name: Build the linux/arm64 image
        working-directory: kitsrc/g1-builder-kit
        run: |
          docker buildx build --platform linux/arm64 --load -f brunson/Dockerfile -t g1-submission:local .
          docker image inspect g1-submission:local --format '{{.Os}}/{{.Architecture}} {{json .Config.Entrypoint}}'
          mkdir -p containers/upload
          docker save g1-submission:local -o containers/upload/submission.tar
          sha256sum containers/upload/submission.tar | tee submission.sha256
          ls -la containers/upload/submission.tar

      - name: Container simulation, 60 s, safety checks on
        working-directory: kitsrc/g1-builder-kit
        run: bash sim.sh --seconds 60 --output out_60s || echo "sim exit $?" | tee -a sim_status.txt

      - name: Container simulation, counterfactual starts
        working-directory: kitsrc/g1-builder-kit
        run: bash sim.sh --seconds 30 --counterfactuals --output out_counterfactuals || echo "counterfactual exit $?" | tee -a sim_status.txt

      - name: Summaries
        if: always()
        working-directory: kitsrc/g1-builder-kit
        run: |
          for d in out_60s out_counterfactuals; do echo "== $d"; cat $d/builder-check.json 2>/dev/null | head -c 3000; echo; done
          cat sim_status.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-evidence
          path: |
            kitsrc/g1-builder-kit/out_60s
            kitsrc/g1-builder-kit/out_counterfactuals
            kitsrc/g1-builder-kit/submission.sha256
            kitsrc/g1-builder-kit/sim_status.txt


      - name: Publish the tested image as a release asset
        if: success()
        working-directory: kitsrc/g1-builder-kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(python3 -c "import json;print(json.load(open('out_60s/builder-check.json'))['status'])")
          echo "60 s check: $status"
          [ "$status" = "simulation_checks_complete" ] || { echo "not publishing"; exit 0; }
          tag="runner-${GITHUB_SHA::7}"
          sha=$(cut -d' ' -f1 submission.sha256)
          python3 -c "import json,sys; json.dump({'schema_version': 1, 'repository_commit': 'e93c49267a7b6b905c6666c8c70668f8ee7ac397', 'image': {'archive_url': 'https://github.com/' + sys.argv[1] + '/releases/download/' + sys.argv[2] + '/submission.tar', 'sha256': sys.argv[3]}, 'required_sensors': ['joint_state', 'imu', 'camera']}, open('g1-runner.json', 'w'), indent=2)" "$GITHUB_REPOSITORY" "$tag" "$sha"
          cat g1-runner.json
          gh release create "$tag" containers/upload/submission.tar g1-runner.json submission.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "G1 Brunson runner image ${GITHUB_SHA::7}" --notes "linux/arm64 runner image built from the HIM builder kit template (kit e93c492). sha256 $sha. Container simulation evidence: workflow run $GITHUB_RUN_ID."

      - uses: actions/upload-artifact@v4
        with:
          name: submission-tar
          path: kitsrc/g1-builder-kit/containers/upload/submission.tar
          compression-level: 0

  template-control:
    # control: the builder kit's own unmodified template image through the same counterfactual starts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Fetch the HIM builder kit
        run: |
          curl -sL https://arena.himrobotics.com/policy-contracts/g1-builder-kit-e93c492-v1.zip -o kit.zip
          unzip -q kit.zip -d kitsrc
      - name: Build the unmodified template image
        working-directory: kitsrc/g1-builder-kit
        run: |
          docker buildx build --platform linux/arm64 --load -f template/Dockerfile -t g1-submission:local .
          mkdir -p containers/upload
          docker save g1-submission:local -o containers/upload/submission.tar
      - name: Template, counterfactual starts
        working-directory: kitsrc/g1-builder-kit
        run: bash sim.sh --seconds 30 --counterfactuals --output template_counterfactuals || echo "template counterfactual exit $?"
      - name: Template reasons
        if: always()
        working-directory: kitsrc/g1-builder-kit
        run: |
          python3 - <<'PY'
          import glob, json
          for f in sorted(glob.glob("template_counterfactuals/poses/*/report.json")):
              d = json.load(open(f))
              print(f.split("/")[-2], d.get("status"), d.get("reason"), json.dumps(d.get("detail")), "handoff", d.get("policy_handoff_at_secs"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-control
          path: kitsrc/g1-builder-kit/template_counterfactuals
